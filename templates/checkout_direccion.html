{% extends 'base.html' %}
{% block contenido %}
<div class="container py-5">
    <div class="mx-auto" style="max-width: 600px;">
        <div class="text-center mb-4">
            <span class="badge bg-info text-dark px-3 py-2">Paso 1 de 3: Envío</span>
        </div>
        <div class="card bg-dark text-white border-secondary shadow-lg p-4">
            <h4 class="mb-4"><i class="fa-solid fa-map-marker-alt text-info me-2"></i> Datos de Entrega</h4>
            
            <form action="/checkout/pago" method="POST">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="small text-secondary">Calle y Número</label>
                        <input type="text" name="calle" class="form-control bg-dark text-white border-secondary" 
                               value="{{ user_address[0] if user_address else '' }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="small text-secondary">Teléfono</label>
                        <input type="tel" name="telefono" class="form-control bg-dark text-white border-secondary" 
                               placeholder="10 dígitos" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="small text-secondary">Colonia</label>
                        <input type="text" name="colonia" class="form-control bg-dark text-white border-secondary" 
                               value="{{ user_address[1] if user_address else '' }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="small text-secondary">C.P.</label>
                        <input type="text" name="cp" class="form-control bg-dark text-white border-secondary" 
                               value="{{ user_address[2] if user_address else '' }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="small text-secondary">Ciudad / Municipio</label>
                        <input type="text" name="ciudad" class="form-control bg-dark text-white border-secondary" 
                               value="{{ user_address[3] if user_address and user_address[3] else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="small text-secondary">Estado</label>
                        <input type="text" name="estado" class="form-control bg-dark text-white border-secondary" 
                               value="{{ user_address[4] if user_address and user_address[4] else '' }}" required>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-info w-100 fw-bold py-2">
                        Continuar al Pago <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
